<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AyhanX-Chat</title>
    <style>
        /* ===== Chat UI modeled on modern messengers (Telegram / WhatsApp style) ===== */
        :root{
            --bg:#0e1621; --bar:#17212b; --bar-2:#1e2c3a; --bubble-in:#182533; --bubble-out:#2b5278;
            --ink:#f5f5f5; --ink-2:#8e9aa6; --ink-3:#6c7883; --accent:#5eb5f7; --accent-2:#4aa3e8;
            --tick:#6ec3ff; --danger:#ff6b6b; --sep:#0b1520;
            --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:var(--sans);-webkit-tap-highlight-color:transparent}
        html,body{height:100%}
        body{
            background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;
            display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased;
        }
        button{font:inherit}
        :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

        /* ---------- Login ---------- */
        #auth-screen{width:92%;max-width:360px;background:var(--bar);border-radius:16px;padding:36px 26px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4)}
        #auth-screen .logo{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,#5eb5f7,#3c7fd0);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 8px 24px rgba(94,181,247,.28)}
        #auth-screen h2{font-size:22px;font-weight:600;margin-bottom:4px}
        #auth-screen p{color:var(--ink-2);font-size:14px;margin-bottom:22px}
        #auth-screen input{width:100%;height:48px;background:var(--bg);border:1px solid #2a3a4b;border-radius:12px;color:var(--ink);padding:0 16px;font-size:16px;text-align:center;outline:none;transition:border-color .2s;margin-bottom:14px}
        #auth-screen input:focus{border-color:var(--accent)}
        #auth-screen input::placeholder{color:var(--ink-3)}
        #auth-screen button{width:100%;height:48px;background:var(--accent-2);border:none;border-radius:12px;color:#fff;font-weight:600;font-size:16px;cursor:pointer;transition:background .2s,transform .15s}
        #auth-screen button:hover{background:var(--accent)}
        #auth-screen button:active{transform:scale(.97)}

        /* ---------- Shell ---------- */
        #chat-screen{display:none;width:100%;height:100vh;height:100dvh;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
        .chat-header{
            background:var(--bar);padding:calc(8px + env(safe-area-inset-top)) 12px 8px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;
            flex-shrink:0;box-shadow:0 1px 0 rgba(0,0,0,.25);z-index:2;
        }
        .chat-header .left{display:flex;align-items:center;gap:11px;min-width:0}
        .chat-header .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#5eb5f7,#3c7fd0);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
        .chat-header .info{min-width:0}
        .chat-header .info .name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .chat-header .info .sub{font-size:13px;color:var(--ink-2);margin-top:1px;display:flex;align-items:center;gap:6px}
        .chat-header .info .sub .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block}
        .chat-header .online-badge{display:none}
        .chat-header .actions{display:flex;gap:2px}
        .chat-header .actions button{background:transparent;border:none;color:var(--ink-2);font-size:19px;cursor:pointer;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .2s}
        .chat-header .actions button:hover{background:var(--bar-2)}

        /* ---------- Messages ---------- */
        #messages-area{
            flex:1;padding:12px 10px 12px 10px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
            display:flex;flex-direction:column;gap:3px;
            background-color:var(--bg);
            background-image:radial-gradient(rgba(94,181,247,.07) 1.2px,transparent 1.4px);
            background-size:22px 22px;
        }
        #messages-area::-webkit-scrollbar{width:4px}
        #messages-area::-webkit-scrollbar-thumb{background:#2b3b4d;border-radius:4px}

        .msg{
            position:relative;max-width:min(78%,520px);padding:6px 9px 4px 10px;font-size:15px;line-height:1.38;
            border-radius:14px;word-wrap:break-word;overflow-wrap:anywhere;margin-top:6px;
            animation:msgIn .18s ease-out;
        }
        @keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
        .msg.received{align-self:flex-start;background:var(--bubble-in);border-top-left-radius:4px;margin-left:8px}
        .msg.sent{align-self:flex-end;background:var(--bubble-out);border-top-right-radius:4px;margin-right:8px}
        /* bubble tails */
        .msg.received::before,.msg.sent::before{content:"";position:absolute;top:0;width:10px;height:14px}
        .msg.received::before{left:-8px;background:var(--bubble-in);-webkit-clip-path:polygon(100% 0,100% 100%,0 0);clip-path:polygon(100% 0,100% 100%,0 0)}
        .msg.sent::before{right:-8px;background:var(--bubble-out);-webkit-clip-path:polygon(0 0,0 100%,100% 0);clip-path:polygon(0 0,0 100%,100% 0)}

        .msg .sender{display:block;font-size:13.5px;font-weight:600;color:var(--accent);margin-bottom:1px;letter-spacing:.005em}
        .msg.sent .sender{color:#9fd8ff}
        .msg .text{white-space:pre-wrap;display:inline}
        .msg .media{display:block;max-width:100%;max-height:300px;border-radius:10px;margin:2px 0 4px 0;cursor:pointer;object-fit:cover}
        .msg .file-icon{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);padding:8px 10px;border-radius:10px;margin:2px 0 4px 0}
        .msg .file-icon a{color:var(--accent);text-decoration:none;word-break:break-all}
        .msg .file-icon a:hover{text-decoration:underline}
        /* timestamp floats in the bubble corner, like Telegram/WhatsApp */
        .msg .timestamp{float:right;margin:6px 0 -2px 10px;font-size:11.5px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:4px;line-height:1}
        .msg.sent .timestamp{color:rgba(255,255,255,.65)}
        .msg.sent .timestamp::after{content:"✓✓";font-size:12px;color:var(--tick);letter-spacing:-2px;margin-left:2px}
        .msg .timestamp .delete-badge{display:none}
        .msg .delete-btn{display:none;background:none;border:none;color:rgba(255,255,255,.6);font-size:13px;cursor:pointer;padding:0 2px;margin-left:2px;line-height:1}
        .msg .delete-btn:hover{color:var(--danger)}
        .msg:hover .delete-btn{display:inline-block}
        @media (hover:none){.msg .delete-btn{display:inline-block}}
        .msg::after{content:"";display:table;clear:both}

        /* ---------- Input bar ---------- */
        .input-bar{background:var(--bar);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:flex-end;flex-shrink:0}
        .input-bar .attach-btn{background:transparent;border:none;color:var(--ink-2);font-size:21px;cursor:pointer;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
        .input-bar .attach-btn:hover{background:var(--bar-2)}
        .input-bar input{flex:1;min-width:0;height:42px;background:var(--bar-2);border:none;border-radius:21px;color:var(--ink);padding:0 16px;font-size:16px;outline:none}
        .input-bar input::placeholder{color:var(--ink-3)}
        .input-bar .send-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--accent-2);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,transform .15s}
        .input-bar .send-btn:hover{background:var(--accent)}
        .input-bar .send-btn:active{transform:scale(.92)}
        #file-input{display:none}

        /* ---------- Call screen ---------- */
        .call-overlay{position:fixed;inset:0;z-index:10000;background:#0b1118;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
        .call-overlay.active{display:flex}
        .call-overlay #remoteVideo{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;background:#0b1118}
        .call-overlay #localVideo{width:110px;height:150px;object-fit:cover;position:absolute;top:calc(20px + env(safe-area-inset-top));right:16px;border-radius:12px;transform:scaleX(-1);z-index:10;background:#000;box-shadow:0 8px 24px rgba(0,0,0,.5)}
        .call-ui{position:absolute;bottom:0;width:100%;z-index:20;background:linear-gradient(to top,rgba(11,17,24,.96) 40%,rgba(11,17,24,0));padding:48px 24px calc(34px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px}
        .call-ui .caller-name{font-size:24px;font-weight:600}
        .call-ui .call-status{font-size:14px;color:var(--ink-2);margin-bottom:20px}
        .call-ui .call-actions{display:flex;gap:26px;align-items:center}
        .call-ui .call-actions button{width:64px;height:64px;border-radius:50%;border:none;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}
        .call-ui .call-actions button:active{transform:scale(.92)}
        .call-ui .btn-hangup{background:var(--danger);color:#fff}
        .call-ui .btn-answer{background:#4ade80;color:#0b1118}
        .call-ui .btn-mute{background:rgba(255,255,255,.14);color:#fff;width:52px;height:52px;font-size:21px}
        .call-ui .btn-mute.muted{background:var(--danger)}

        @media (max-width:480px){
            .msg{max-width:84%;font-size:15px}
            .chat-header{padding-left:8px;padding-right:8px}
        }
        @media (hover:none){
            .chat-header,.input-bar{background:var(--bar)}
            .msg{animation:none}
        }
        @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
        </style>
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen">
        <div class="logo">💬</div>
        <h2>AyhanX-Chat</h2>
        <p>Choose a name to join the group chat</p>
        <input type="text" id="username-input" placeholder="Your name..." maxlength="20" autofocus>
        <button onclick="login()">Join ➜</button>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen">
        <div class="chat-header">
            <div class="left">
                <div class="avatar">👥</div>
                <div class="info">
                    <div class="name">Group Chat</div>
                    <div class="sub">
                        <span class="dot"></span>
                        <span id="online-status">0 online</span>
                    </div>
                </div>
            </div>
            <div class="online-badge" id="online-badge">0</div>
            <div class="actions">
                <button class="call-btn" onclick="startCall('voice')" title="Voice call">📞</button>
                <button class="call-btn" onclick="startCall('video')" title="Video call">📹</button>
            </div>
        </div>

        <div id="messages-area"></div>

        <div class="input-bar">
            <button class="attach-btn" onclick="document.getElementById('file-input').click()">📎</button>
            <input type="file" id="file-input" accept="image/*,video/*,audio/*,application/*" multiple>
            <input type="text" id="text-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- Call Overlay -->
    <div class="call-overlay" id="callScreen">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="call-ui">
            <div class="caller-name" id="callerName">Calling...</div>
            <div class="call-status" id="callStatus">Connecting securely...</div>
            <div class="call-actions">
                <button class="btn-mute" id="muteBtn" onclick="toggleMute()" title="Mute">🔊</button>
                <button class="btn-hangup" onclick="hangupCall()">📞</button>
                <button class="btn-answer" id="answerBtn" onclick="answerCall()" style="display:none;">✅</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  STATE
        // ============================================================
        const SERVER_URL = window.location.origin;
        let myName = '';
        let lastMsgIndex = 0;
        let messageCache = new Map();
        let messageElements = new Map();
        let isMuted = false;
        let localStream = null;
        let peerConnection = null;
        let callType = 'voice';
        let isCaller = false;
        let callActive = false;
        let pendingCandidates = [];
        let currentCallId = null; // unique ID per call to avoid confusion

        // ----- No STUN – only host candidates (works on local network) -----
        const rtcConfig = {
            iceServers: [],
            iceTransportPolicy: 'all'  // use all candidates (host, server reflexive, relay)
        };

        // DOM refs
        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const usernameInput = document.getElementById('username-input');
        const messagesArea = document.getElementById('messages-area');
        const textInput = document.getElementById('text-input');
        const onlineStatus = document.getElementById('online-status');
        const onlineBadge = document.getElementById('online-badge');
        const fileInput = document.getElementById('file-input');
        const callScreen = document.getElementById('callScreen');
        const remoteVideo = document.getElementById('remoteVideo');
        const localVideo = document.getElementById('localVideo');
        const callerName = document.getElementById('callerName');
        const callStatus = document.getElementById('callStatus');
        const answerBtn = document.getElementById('answerBtn');
        const muteBtn = document.getElementById('muteBtn');

        // ============================================================
        //  LOGIN
        // ============================================================
        async function login() {
            const name = usernameInput.value.trim();
            if (!name) { usernameInput.style.borderColor = '#f15c6d'; setTimeout(() => usernameInput.style.borderColor = 'transparent', 1000); return; }
            myName = name;
            try {
                const res = await fetch(`${SERVER_URL}/register_user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: myName })
                });
                if (res.ok) {
                    authScreen.style.display = 'none';
                    chatScreen.style.display = 'flex';
                    document.title = `AyhanX-Chat — ${myName}`;
                    await pollMessages(true);
                    await pollUsers();
                    setInterval(() => pollMessages(false), 1000);
                    setInterval(pollUsers, 4000);
                    setTimeout(() => textInput.focus(), 300);
                } else {
                    alert('Name already taken. Try another.');
                }
            } catch (e) {
                alert('Cannot connect to server. Check HTTPS and certificate.');
                console.error(e);
            }
        }
        usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

        // ============================================================
        //  MESSAGES
        // ============================================================
        async function pollMessages(initial = false) {
            try {
                const res = await fetch(`${SERVER_URL}/get_messages`);
                const msgs = await res.json();

                if (msgs.length < lastMsgIndex) {
                    messagesArea.innerHTML = '';
                    messageCache.clear();
                    messageElements.clear();
                    lastMsgIndex = 0;
                }

                for (let i = lastMsgIndex; i < msgs.length; i++) {
                    const m = msgs[i];

                    if (m.type === 'delete') {
                        const deletedId = m.text;
                        if (messageElements.has(deletedId)) {
                            const el = messageElements.get(deletedId);
                            el.remove();
                            messageElements.delete(deletedId);
                            messageCache.delete(deletedId);
                        }
                        continue;
                    }

                    if (m.type === 'sig' && m.username !== myName) {
                        try {
                            const data = JSON.parse(m.text);
                            console.log('📨 Signaling received:', data);
                            handleIncomingSignaling(data, m.username);
                        } catch(e) {
                            console.warn('Failed to parse signaling:', e);
                        }
                        continue;
                    }

                    if (m.id && !messageCache.has(m.id)) {
                        messageCache.set(m.id, m);
                        renderMessage(m);
                    } else if (!m.id) {
                        const key = `${m.username}|${m.timestamp}|${m.text}`;
                        if (!messageCache.has(key)) {
                            messageCache.set(key, m);
                            renderMessage(m);
                        }
                    }
                }
                lastMsgIndex = msgs.length;
                if (!initial) scrollToBottom();
            } catch (e) { /* ignore */ }
        }

        function renderMessage(m) {
            const side = m.username === myName ? 'sent' : 'received';
            const div = document.createElement('div');
            div.className = `msg ${side}`;
            div.dataset.id = m.id;
            const time = new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let content = `<span class="sender">${escapeHtml(m.username)}</span>`;

            if (m.type === 'text') {
                content += `<div class="text">${escapeHtml(m.text)}</div>`;
            } else if (m.type === 'media' && m.media_url) {
                const url = m.media_url;
                const ext = url.split('.').pop().toLowerCase();
                if (['jpg','jpeg','png','gif','webp','bmp'].includes(ext)) {
                    content += `<img class="media" src="${url}" alt="Image" onclick="window.open('${url}')" />`;
                } else if (['mp4','webm','ogg','mov'].includes(ext)) {
                    content += `<video class="media" src="${url}" controls></video>`;
                } else {
                    content += `<div class="file-icon">📄 <a href="${url}" target="_blank">${escapeHtml(m.text) || 'File'}</a></div>`;
                }
            }

            content += `<div class="timestamp">${time} <span class="delete-badge">🗑️ 5m</span>`;
            if (m.username === myName) {
                content += `<button class="delete-btn" onclick="deleteMessage('${m.id}')" title="Delete for everyone">✖</button>`;
            }
            content += `</div>`;
            div.innerHTML = content;
            messagesArea.appendChild(div);
            messageElements.set(m.id, div);
        }

        async function deleteMessage(messageId) {
            if (!confirm('Delete this message for everyone?')) return;
            try {
                const res = await fetch(`${SERVER_URL}/delete_message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: messageId, username: myName })
                });
                if (res.ok) {
                    if (messageElements.has(messageId)) {
                        messageElements.get(messageId).remove();
                        messageElements.delete(messageId);
                        messageCache.delete(messageId);
                    }
                } else {
                    const data = await res.json();
                    alert(data.msg || 'Delete failed.');
                }
            } catch (e) {
                console.error('Delete error', e);
            }
        }

        function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
        function scrollToBottom() { setTimeout(() => messagesArea.scrollTop = messagesArea.scrollHeight, 50); }

        // ============================================================
        //  USERS
        // ============================================================
        async function pollUsers() {
            try {
                const res = await fetch(`${SERVER_URL}/get_users`);
                const users = await res.json();
                const count = users.length;
                onlineStatus.textContent = `${count} online`;
                onlineBadge.textContent = count;
            } catch (e) { /* ignore */ }
        }

        // ============================================================
        //  SEND MESSAGE
        // ============================================================
        async function sendMessage(textOverride) {
            let text = textOverride || textInput.value.trim();
            if (!text && !fileInput.files.length) return;

            if (fileInput.files.length > 0) {
                for (const file of fileInput.files) {
                    await uploadAndSendFile(file);
                }
                fileInput.value = '';
                return;
            }

            if (!text) return;
            textInput.value = '';

            try {
                await fetch(`${SERVER_URL}/send_message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: myName, text: text, type: 'text' })
                });
            } catch (e) { console.error('Send failed', e); }
        }

        async function uploadAndSendFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch(`${SERVER_URL}/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                if (data.status === 'success') {
                    await fetch(`${SERVER_URL}/send_message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: myName,
                            text: file.name,
                            type: 'media',
                            media_url: data.url
                        })
                    });
                } else {
                    alert('Upload failed.');
                }
            } catch (e) {
                console.error('Upload error', e);
                alert('Upload failed.');
            }
        }

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) sendMessage();
        });

        // ============================================================
        //  WEBRTC CALL - SIMPLIFIED & LOGGED
        // ============================================================
        function sendSignal(payload) {
            const msg = {
                username: myName,
                text: JSON.stringify(payload),
                type: 'sig',
                target: 'call'
            };
            fetch(`${SERVER_URL}/send_message`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(msg)
            }).catch(e => console.error('Signal send failed', e));
        }

        function generateCallId() {
            return `${myName}-${Date.now()}`;
        }

        async function startCall(mode) {
            if (callActive) {
                alert('Call already in progress.');
                return;
            }
            callActive = true;
            callType = mode;
            isCaller = true;
            currentCallId = generateCallId();
            answerBtn.style.display = 'none';
            callerName.textContent = 'Group Call';
            callStatus.textContent = `Starting ${mode} call...`;
            callScreen.classList.add('active');

            try {
                const constraints = {
                    audio: true,
                    video: mode === 'video' ? { facingMode: 'user' } : false
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;

                setupPeerConnection();

                const offerOptions = {
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: mode === 'video'
                };
                const offer = await peerConnection.createOffer(offerOptions);
                await peerConnection.setLocalDescription(offer);
                console.log('📤 Sending offer (callId:', currentCallId, ')');
                console.log('📤 Offer SDP:', offer.sdp);
                sendSignal({
                    callId: currentCallId,
                    cmd: 'offer',
                    sdp: peerConnection.localDescription,
                    caller: myName,
                    callMode: mode
                });
                callStatus.textContent = 'Ringing...';
            } catch (e) {
                alert('Could not access camera/microphone.\n' + e.message);
                closeCallUI();
                console.error(e);
            }
        }

        function setupPeerConnection() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            peerConnection = new RTCPeerConnection(rtcConfig);
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = (event) => {
                console.log('📹 Remote stream received');
                remoteVideo.srcObject = event.streams[0];
                callStatus.textContent = 'Connected!';
                callStatus.style.color = '#00a884';
                // Add any pending candidates that arrived before remote description
                if (pendingCandidates.length && peerConnection.remoteDescription) {
                    for (const candidate of pendingCandidates) {
                        peerConnection.addIceCandidate(candidate).catch(e => console.warn('Failed to add pending candidate', e));
                    }
                    pendingCandidates = [];
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log('🧊 Sending ICE candidate:', event.candidate);
                    sendSignal({
                        callId: currentCallId,
                        candidate: event.candidate
                    });
                } else {
                    console.log('🧊 ICE gathering complete');
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                console.log('ICE state:', peerConnection.iceConnectionState);
                if (peerConnection.iceConnectionState === 'connected') {
                    callStatus.textContent = 'Connected!';
                    callStatus.style.color = '#00a884';
                } else if (peerConnection.iceConnectionState === 'disconnected' ||
                           peerConnection.iceConnectionState === 'failed') {
                    hangupCall();
                }
            };

            peerConnection.onicecandidateerror = (e) => {
                console.warn('ICE candidate error', e);
            };
        }

        async function handleIncomingSignaling(data, fromUser) {
            console.log('🔔 Handling signal from', fromUser, data);

            // If we have a callId, ensure it matches the current call (if any)
            if (data.callId && currentCallId && data.callId !== currentCallId) {
                console.log('⚠️ Ignoring signal for different callId:', data.callId);
                return;
            }

            if (data.cmd === 'offer') {
                if (callActive) {
                    sendSignal({ callId: data.callId, cmd: 'busy' });
                    return;
                }
                // New incoming call
                callActive = true;
                isCaller = false;
                callType = data.callMode || 'voice';
                currentCallId = data.callId;
                answerBtn.style.display = 'flex';
                callerName.textContent = fromUser;
                callStatus.textContent = `${callType === 'video' ? '📹' : '📞'} Incoming call...`;
                callScreen.classList.add('active');

                try {
                    const constraints = {
                        audio: true,
                        video: callType === 'video' ? { facingMode: 'user' } : false
                    };
                    localStream = await navigator.mediaDevices.getUserMedia(constraints);
                    localVideo.srcObject = localStream;
                    setupPeerConnection();
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    console.log('✅ Remote description set for offer');
                    // Add any candidates that arrived before remote description
                    if (pendingCandidates.length) {
                        for (const candidate of pendingCandidates) {
                            await peerConnection.addIceCandidate(candidate).catch(e => console.warn('Failed to add pending candidate', e));
                        }
                        pendingCandidates = [];
                    }
                } catch (e) {
                    console.error('Incoming call setup failed', e);
                    hangupCall();
                }
            } else if (data.sdp) {
                // This is an answer – set remote description
                if (peerConnection && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    console.log('✅ Remote description set for answer');
                    // Add any pending candidates
                    if (pendingCandidates.length) {
                        for (const candidate of pendingCandidates) {
                            await peerConnection.addIceCandidate(candidate).catch(e => console.warn('Failed to add pending candidate', e));
                        }
                        pendingCandidates = [];
                    }
                }
            } else if (data.candidate) {
                if (peerConnection) {
                    if (peerConnection.remoteDescription) {
                        try {
                            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                            console.log('🧊 ICE candidate added');
                        } catch(e) {
                            console.warn('ICE candidate error', e);
                        }
                    } else {
                        pendingCandidates.push(new RTCIceCandidate(data.candidate));
                        console.log('🧊 Candidate stored (waiting for remote description)');
                    }
                }
            } else if (data.cmd === 'hangup') {
                console.log('📞 Hangup received');
                closeCallUI();
            } else if (data.cmd === 'busy') {
                callStatus.textContent = 'User is busy';
                setTimeout(closeCallUI, 1500);
            }
        }

        async function answerCall() {
            if (!peerConnection) return;
            answerBtn.style.display = 'none';
            callStatus.textContent = 'Connecting...';
            try {
                const answerOptions = {
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: callType === 'video'
                };
                const answer = await peerConnection.createAnswer(answerOptions);
                await peerConnection.setLocalDescription(answer);
                console.log('📤 Sending answer');
                console.log('📤 Answer SDP:', answer.sdp);
                sendSignal({
                    callId: currentCallId,
                    sdp: peerConnection.localDescription
                });
            } catch (e) {
                console.error('Answer failed', e);
                hangupCall();
            }
        }

        function hangupCall() {
            console.log('📞 Hanging up');
            if (callActive) {
                sendSignal({ callId: currentCallId, cmd: 'hangup' });
            }
            closeCallUI();
        }

        function closeCallUI() {
            callActive = false;
            pendingCandidates = [];
            currentCallId = null;
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            remoteVideo.srcObject = null;
            localVideo.srcObject = null;
            callScreen.classList.remove('active');
            answerBtn.style.display = 'none';
            callStatus.style.color = '';
            isCaller = false;
            isMuted = false;
            muteBtn.textContent = '🔊';
            muteBtn.classList.remove('muted');
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
            muteBtn.classList.toggle('muted', isMuted);
        }

        // ============================================================
        //  INIT
        // ============================================================
        usernameInput.focus();
        console.log('💬 WhatsApp clone (host‑only ICE, detailed logging).');
        console.log('ℹ️  If the call still fails, open the browser console and share the logs.');
    </script>
